[project]
name = "semantic-agent"
version = "0.1.0"
description = "행정법 질문에 글로 답하는 채팅 에이전트"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langgraph>=1.2.12",
    "deepagents==0.7.19",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "langchain-openai>=1.6.6",
    "langchain-google-genai==4.4.0",
    "google-genai==2.25.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
