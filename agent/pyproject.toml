[project]
name = "semantic-agent"
version = "0.1.0"
description = "채팅 에이전트 — Deep Agents(LangGraph) 위에서 Rust 검색·판정 서비스를 도구로 부른다"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3",
    "langgraph>=1.2",
    "deepagents>=0.6.1",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "langchain-openai>=1.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[tool.uv]
package = false
