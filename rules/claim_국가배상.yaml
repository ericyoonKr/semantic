# 국가배상(국가배상법 제2조) 요건 트리 (PROJECT.md §7.4)
# 총정리 PDF 33~39쪽이 사실상 완성된 트리 — 8리프 AND + 법령위반 OR.
#
# CLAIM_국가배상 (AND)
#   R1_공무원     LEAF: "가해행위를 한 자가 기능적 의미의 공무원(공무를 위탁받은
#                        사인 포함, 일시적 사무 포함)이다"
#   R2_직무       LEAF: "그 행위가 직무에 해당한다(입법·사법 포함, 사경제작용 제외)"
#   R3_집행하면서 LEAF: "직무를 집행하면서 한 행위다 — 외형설: 객관적으로 직무행위로
#                        보이는 때 (실제 직무 의사 불문)"
#   R4_고의과실   LEAF: "당해 직무를 담당하는 평균적 공무원의 주의의무를 게을리했다"
#   R5_법령위반   (OR)
#     R5a LEAF: "엄격한 의미의 법규(법률·법규명령·행정법 일반원칙)를 위반했다"
#     R5b LEAF: "인권존중·권력남용금지·신의성실 등 준수해야 할 준칙을 위반했다"
#   R6_타인       LEAF: "피해자가 가해 공무원 및 그 행위에 가담한 자가 아니다"
#   R7_손해       LEAF: "법익침해로서의 불이익이 발생했다(반사적 이익 침해 제외)"
#   R8_인과관계   LEAF: "직무집행행위와 손해 사이에 상당인과관계가 있다"
#     # 주의(§7.3 금지): 상당인과관계를 통째로 물으면 안 되는 원칙이 있으나,
#     # 1차 버전에서는 판례 기준(제반사정 종합)을 proposition에 명시하고
#     # 필요 시 하위 사실로 추가 분해한다.
#
# 스키마 형식은 claim_취소소송.yaml 주석 참조.
