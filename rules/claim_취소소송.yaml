# 취소소송 요건 트리 (PROJECT.md §7.4)
# ★ 작성 전 필수: burden 의미 재정의 확정 (§7.5) — 소송요건=직권조사 /
#   본안 적법성 입증=처분청 / 재량 일탈·남용 입증=원고.
#
# 스키마 (ruleloader가 engine::schema로 검증):
# claim_type: CLAIM_처분취소
# expected: { nodes: N, edges: M, leaves: L }   # 적재 가드 — 불일치 시 전체 중단
# nodes:
#   - id: CLAIM_처분취소
#     gate: AND            # LEAF | AND | OR
#     description: 처분 취소청구의 성립
#   - id: S1_처분성
#     gate: AND
#     description: 항고소송 대상인 처분에 해당하는지
#   - id: S1a_행정청의행위
#     gate: LEAF
#     burden: <§7.5 결정 후>
#     proposition: "문제된 행위를 한 주체가 행정청(위임·위탁받은 기관·사인 포함)이다"
#   # ... S1b_구체적사실 / S1c_공권력행사 / S1d_외부적법효과
#   # S2_원고적격(법률상 이익), S4_협의의소익
#   - id: S3_제소기간            # 행정소송법 제20조
#     gate: AND
#     # 산술 리프: LLM은 날짜 추출만. 마감일은 checks::periods(민법 기간 규정), 판정은 Z3 정수 비교.
#     # 기산점은 행정심판을 거쳤는지로 갈린다 (제20조 제1항 단서, 제2항 괄호):
#   #   S3_심판경유   LEAF: "원고가 이 처분에 대하여 행정심판을 청구하였다"
#   #   S3_심판미경유 LEAF: "원고가 이 처분에 대하여 행정심판을 청구하지 않았다"
#   #     # 게이트에 NOT이 없으므로 긍정·부정 쌍 리프로 둔다 — compile.rs의 쌍 공리
#   #     # (S3_심판미경유 == Not(S3_심판경유))와 leaf.rs의 모순 검출이 함께 적용된다.
#   #     # 제1항 단서가 적용되는 청구: 행정심판을 청구할 수 있었던 경우 또는 행정청이
#   #     # 청구할 수 있다고 잘못 알린 경우에 한 청구 — 1차 버전은 청구 사실만 묻는다.
#   #   S3a_90일 (OR)                                                    — 제1항
#   #     S3a1 (AND): S3_심판미경유,
#   #           { arithmetic: { kind: within_days, days: 90, from: 처분이_있음을_안_날, to: 제소일 } }
#   #     S3a2 (AND): S3_심판경유,
#   #           { arithmetic: { kind: within_days, days: 90, from: 재결서_정본_송달일, to: 제소일 } }
#   #   S3b_1년 (OR)                                                     — 제2항
#   #     S3b1 (AND): S3_심판미경유,
#   #           { arithmetic: { kind: within_years, years: 1, from: 처분이_있은_날, to: 제소일 } }
#   #     S3b2 (AND): S3_심판경유,
#   #           { arithmetic: { kind: within_years, years: 1, from: 재결이_있은_날, to: 제소일 } }
#   #     S3b3 LEAF: "1년이 지나 제기한 데에 정당한 사유가 있다"          — 제2항 단서
#   #   ★ 1년은 365일이 아니다 — 연으로 정한 기간은 역에 따라 계산한다 (민법 제160조).
#   - id: 본안_위법성
#     gate: OR
#   # 절차하자(사전통지·이유제시 결여), 법률유보위반,
#   # 재량하자(OR): 일탈 / 남용(OR: 사실오인·비례원칙·평등원칙) / 불행사
# edges:
#   - { parent: CLAIM_처분취소, child: S1_처분성, relation: ELEMENT }
#   # relation: ELEMENT | DEFENSE | REBUTTAL
#
# 리프 문장 규칙 (§7.3): "누가·언제·무엇을" 사실 문장. 법적 평가어
# ("처분성이 있다", "재량을 남용했다")를 리프로 두지 않는다 — 징표로 분해.
# 리프 재료: ~/Downloads/대학 행정법 총정리.pdf 의 개념 징표·판례 기준.
